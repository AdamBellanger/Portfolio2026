services:
  portfolio:
    build: .
    image: adam-bellanger-portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    env_file:
      - .env
    # No published port: Nginx Proxy Manager reaches it by container name
    # over the shared network (Forward Hostname: portfolio, Port: 3000).
    expose:
      - "3000"
    volumes:
      # Visit counter (data/visits.json) survives rebuilds and redeploys.
      - portfolio-data:/app/data
    networks:
      - services_default
    # Hardening: no privilege escalation, no Linux capabilities (port 3000
    # needs none), bounded memory, rotated logs so they can't fill the disk.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  portfolio-data:

networks:
  services_default:
    external: true
